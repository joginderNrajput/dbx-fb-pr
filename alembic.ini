# Alembic configuration for the Postgres sink. It holds NO database URL: env.py reads
# DBXF_DATABASE_URL / DBXF_DB_SCHEMA / DBXF_DB_TABLE_PREFIX from the environment or .env.
#
#   alembic upgrade head          # same as: python discovery.py db-init
#   alembic current / history
[alembic]
script_location = dbx_premig.db:migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
