# The REST API. The database is the existing Azure Database for PostgreSQL configured in
# .env (DBXF_DATABASE_URL, DBXF_DB_SCHEMA): no Postgres container is started.
#
#   docker compose up -d --build
#
# On start-up the API applies the Alembic migrations (DBXF_DB_AUTO_MIGRATE=true), so the
# tables exist before the first request. Set it to "false" to run them by hand instead:
#   docker compose run --rm api db-init
services:
  api:
    build: .
    ports:
      - "${DBXF_API_PORT:-7073}:${DBXF_API_PORT:-7073}"
    environment:
      DBXF_API_PORT: "${DBXF_API_PORT:-7073}"
      DBXF_LOG_LEVEL: "INFO"
      DBXF_DB_AUTO_MIGRATE: "${DBXF_DB_AUTO_MIGRATE:-true}"
      # DBXF_API_KEY: set in .env
      # DBXF_ASSESSMENT_RULES: /config/assessment_rules.yaml
    env_file:
      - path: .env
        required: true
    volumes:
      - runs:/data/runs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${DBXF_API_PORT:-7073}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

volumes:
  runs:
